services:
  # ─────────────────────────────────────────────
  # Backend — FastAPI + Python
  # ─────────────────────────────────────────────
  backend:
    image: ghcr.io/julilescuras/printfarm-backend:latest
    container_name: printfarm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data               # SQLite persistence
      - ./backend/gcodes:/app/gcodes           # G-code file storage
      - /var/run/docker.sock:/var/run/docker.sock  # 1-click update (Linux only)
      - ${HOME}/.docker:/root/.docker:ro       # GHCR credentials for 1-click update
    env_file:
      - .env
    depends_on:
      - spoolman
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - printfarm
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # Frontend — Next.js
  # ─────────────────────────────────────────────
  frontend:
    image: ghcr.io/julilescuras/printfarm-frontend:latest
    container_name: printfarm-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - BACKEND_WS_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NODE_OPTIONS=--max-old-space-size=256
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - printfarm
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # Spoolman — Filament Management
  # ─────────────────────────────────────────────
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: printfarm-spoolman
    ports:
      - "7912:8000"
    volumes:
      - spoolman_data:/home/app/.local/share/spoolman
    environment:
      - TZ=America/Argentina/Buenos_Aires
    restart: unless-stopped
    networks:
      - printfarm


  # ─────────────────────────────────────────────
  # Control Ventas + sincronización OneDrive (perfil opcional "controlventas")
  # Solo arrancan si el .env del servidor tiene COMPOSE_PROFILES=controlventas.
  # Prioridad: el Manager es lo crítico → estos dos llevan límites estrictos y
  # oom_score_adj alto para que, si falta memoria, Linux los corte a ellos primero.
  # ─────────────────────────────────────────────
  onedrive-sync:
    image: driveone/onedrive:2.5.11-debian   # versión fija: es lo único que puede borrar archivos
    container_name: ziegel-onedrive
    profiles: ["controlventas"]
    # Se llama al binario directo: el entrypoint de la imagen corta en los espacios
    # el valor de ONEDRIVE_SINGLE_DIRECTORY ("dieseños 2026" → "dieseños").
    # --single-directory evita recorrer todo el OneDrive en cada revisión.
    user: "${CV_UID:-1000}:${CV_GID:-1000}"
    entrypoint: ["/usr/local/bin/onedrive"]
    command: ["--confdir", "/onedrive/conf", "--syncdir", "/onedrive/data", "--monitor", "--single-directory", "2026/dieseños 2026"]
    environment:
      - HOME=/onedrive/conf
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/ziegel/onedrive-conf:/onedrive/conf
      - /srv/ziegel/OneDrive:/onedrive/data
    restart: unless-stopped
    oom_score_adj: 900
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  controlventas:
    image: ghcr.io/julilescuras/controlventas:latest
    container_name: ziegel-controlventas
    profiles: ["controlventas"]
    user: "${CV_UID:-1000}:${CV_GID:-1000}"   # mismo dueño que los archivos que baja onedrive-sync
    ports:
      - "3100:3000"
    environment:
      - CONTROLVENTAS_MODE=server
      - CONTROLVENTAS_ROOT=/catalogo/dieseños 2026
      - CONTROLVENTAS_ALLOWED_HOSTS=${CV_ALLOWED_HOSTS:-192.168.20.25,100.126.215.99}
      - CONTROLVENTAS_PRINTFARM_URL=http://backend:8000
      - CONTROLVENTAS_PRINTFARM_TOKEN=${CONTROLVENTAS_PRINTFARM_TOKEN:-}
      - CONTROLVENTAS_ONEDRIVE_LOG=${CV_ONEDRIVE_LOG:-}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/ziegel/OneDrive/2026:/catalogo
      - /srv/ziegel/onedrive-conf/logs:/onedrive-logs:ro
    depends_on:
      - onedrive-sync
    restart: unless-stopped
    oom_score_adj: 800
    networks:
      - printfarm
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  spoolman_data:
    driver: local

networks:
  printfarm:
    driver: bridge
